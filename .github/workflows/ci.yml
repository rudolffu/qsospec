name: CI

on:
  pull_request:
  push:
    branches-ignore: ["release/**"]
  workflow_dispatch:

jobs:
  fast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m pytest -m 'not slow and not integration and not external_data and not plotting and not benchmark'
      - run: python -m build

  host-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[host,dev]'
      - name: Synthetic host tests (no local template assets)
        run: >-
          python -m pytest
          tests/test_host_decomp.py
          tests/test_host_agn_pseudocontinuum.py
          tests/test_host_fraction_vocabulary.py
          tests/test_host_sed_reconstruction.py
          tests/test_host_template_profiles.py
          tests/test_qsospec_host_workflow.py

  docs:
    runs-on: ubuntu-latest
    env:
      QSOSPEC_DOCS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[docs]'
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
